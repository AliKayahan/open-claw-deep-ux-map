display_name: Deep Journey Mapper
short_description: Platform-agnostic AI journey mapping with fresh AI context per journey and shared learnings.
default_prompt: >-
  Explore the target web platform like a curious expert user. Auto-discover semantic journeys, then execute each journey in a fresh AI context (new agent/subagent context per journey), sharing only persisted learnings between runs. Fill forms semantically, satisfy unlock gates (required fields, at least N items, step N of M), and continue through newly unlocked flows until completion. If chat/assistant surfaces exist, run meaningful multi-turn interactions and continue with unlocked actions. Test risky branches with both Cancel and Confirm where relevant. Emit progress after every completed journey with journeyName, depth, start, end, status, milestonesCompleted, gatesSatisfied, and blockedReason. Stay platform-agnostic and avoid domain-specific assumptions. Persist outputs under artifacts/.
